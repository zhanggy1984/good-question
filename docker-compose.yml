services:

  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-native_rag}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 聊天问答缓存：相同问题+空上下文命中重放 SSE，省 DeepSeek 计费
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Milvus 元数据存储
  etcd:
    container_name: rag-etcd
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  # Milvus 对象存储
  minio:
    container_name: rag-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    # minio 镜像是 scratch 极简基座（无 curl/bash 可做健康检查），故省略；
    # milvus 对 minio 是 started 依赖（非 healthy），且 Milvus 自带对 MinIO 的重连
    restart: unless-stopped

  # Milvus Standalone：统一语义检索（dense）+ BGE-M3 学习稀疏（sparse）混合检索
  milvus:
    container_name: rag-milvus
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  # Attu：Milvus 可视化管理 UI（collection/partition/数据浏览/查询）
  attu:
    container_name: rag-attu
    image: zilliz/attu:v2.5.6
    environment:
      # MILVUS_URL 格式 host:port，不带 http:// 前缀；compose 内用服务名解析
      MILVUS_URL: milvus:19530
    ports:
      - "${ATTU_PORT:-8000}:3000"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: rag-backend
    env_file:
      - .env
    # HF 模型全部走离线缓存（model_cache volume）：hf_hub 0.36 走镜像站校验会失败，
    # bge-m3（FlagEmbedding 稀疏）/ bge-reranker / jina-embeddings 均由缓存加载。
    # 缺失会导致 BGEM3SparseEmbeddingFunction 构造时 HF 校验异常（其 except 吞错并误导为"未安装"）。
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - uploads_data:/app/data/uploads
      - model_cache:/root/.cache
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./frontend
    container_name: rag-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  uploads_data:
  model_cache:
  redis_data:
