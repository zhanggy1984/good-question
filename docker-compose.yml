# ============================================================
# good-question — 共享 infra 模式（全共享方案，2026-08-25 起）
#
# 本 agent 不自带任何中间件，全部依赖共享 infra：
#   mysql  -> infra MySQL（库 native_rag / 账号 native_rag_user）
#   redis  -> infra Redis（db index 2）
#   milvus -> infra Milvus（collection rag_chunks，已带 rag_ 前缀）
#
# 前置：先部署共享 infra（D:/study/aiprojcet/infra，`docker compose up -d`）。
# 启动：docker compose up -d --build
# 连接：前端 http://localhost:8089 / 后端 http://localhost:8080
# ============================================================

name: good-question

services:
  backend:
    build: ./backend
    container_name: rag-backend
    env_file:
      - .env
    # HF 模型全部走离线缓存（model_cache volume）：bge-m3/reranker/jina 均由缓存加载
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - uploads_data:/app/data/uploads
      - model_cache:/root/.cache
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - shared-infra

  nginx:
    build: ./frontend
    container_name: rag-nginx
    ports:
      - "8089:80"                       # 避 80 特权/占用，端口表分配
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - shared-infra

volumes:
  uploads_data:
  model_cache:

networks:
  shared-infra:
    external: true
    name: shared-infra_shared-infra
