# ═══════════ TLS 生产启用说明 ═══════════
# TLS 终止最优位置是共享 infra 入口（网关前 LB/ingress）；本 nginx 也可直接终止。
# 启用步骤：
#   1) 证书放入镜像 /etc/nginx/ssl/（Dockerfile COPY certs/ 或 compose 挂载 volume）
#   2) 取消下方 443 模板注释，将 80 块 listen 行改为 return 301 https://$host$request_uri;
# 未配置证书前保持 80 运行（443 模板被注释，nginx 不会因缺证书启动失败）。
# ────────────────────────────────────────
# server {
#     listen 443 ssl;
#     server_name localhost;
#     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_session_cache shared:SSL:10m;
#     # 以下 location 配置复制自下方 80 块（/api/ 反代 + SSE 关缓冲 + SPA 回退）
# }

server {
    listen 80;
    server_name localhost;

    # 上传限制：对齐后端 MAX_FILE_SIZE=50MB（nginx 默认仅 1MB，会 413 拦截 PDF）
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/markdown;
    gzip_min_length 1024;

    # /api/ 反代到统一网关（api-gateway:8099），网关按 Host 头路由到 rag-backend
    # （SSE 流式传输必须关闭缓冲）
    location /api/ {
        proxy_pass http://api-gateway:8099;
        proxy_set_header Host gq.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 其他所有请求 → Vue SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 页面静态资源安全头（HTML/JS/CSS 不经后端，需 nginx 层加；
        # /api/ 响应由后端安全头中间件负责，避免两处重复头）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
    }
}
