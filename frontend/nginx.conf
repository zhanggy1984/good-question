# TLS 终止在共享 infra 入口（网关前 LB/ingress），本 nginx 仅走 80（见 README 安全模型）
server {
    listen 80;
    server_name localhost;

    # 上传限制：对齐后端 MAX_FILE_SIZE=50MB（nginx 默认仅 1MB，会 413 拦截 PDF）
    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml text/markdown;
    gzip_min_length 1024;

    # /api/ 反代到统一网关（api-gateway:8099），网关按 Host 头路由到 rag-backend
    # （SSE 流式传输必须关闭缓冲）
    location /api/ {
        proxy_pass http://api-gateway:8099;
        proxy_set_header Host gq.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 其他所有请求 → Vue SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 页面静态资源安全头（HTML/JS/CSS 不经后端，需 nginx 层加；
        # /api/ 响应由后端安全头中间件负责，避免两处重复头）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
    }
}
